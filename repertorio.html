<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Quiz Repertório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  /* Ideia: fichas de catálogo de biblioteca sobre feltro verde. Classes com números Dewey; lombadas mais altas, fichas mais difíceis. */
  --felt:#13241f;
  --paper:#eceee6;
  --ink:#16201d;
  --brass:#d6ab4c;
  --ok:#1f7a4d;
  --bad:#b3341f;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"Courier Prime","Courier New",monospace;
  --raise:color-mix(in srgb,var(--paper) 7%,var(--felt));
  --rule:color-mix(in srgb,var(--paper) 18%,var(--felt));
  --mute:color-mix(in srgb,var(--paper) 64%,var(--felt));
  --ink-mute:color-mix(in srgb,var(--ink) 66%,var(--paper));
  --ok-lt:color-mix(in srgb,var(--ok) 58%,#fff);
  --bad-lt:color-mix(in srgb,var(--bad) 52%,#fff);
  --shelf:color-mix(in srgb,var(--brass) 55%,var(--felt));
  --track:color-mix(in srgb,var(--brass) 16%,var(--felt));
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--felt)}
body{
  margin:0;min-height:100%;
  background:radial-gradient(900px 520px at 50% -8%,color-mix(in srgb,var(--paper) 8%,var(--felt)),var(--felt) 70%) var(--felt);
  color:var(--paper);font-family:var(--body);font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 56px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tag{font-family:var(--mono);font-size:.78rem;font-weight:400;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:0}
.tag.brass{color:var(--brass)}
button{font:inherit}
.unit{font-family:var(--mono);font-weight:400;font-size:.76rem;letter-spacing:.02em;color:var(--mute)}
.note{margin:8px 0 0;font-size:.95rem;color:var(--mute);max-width:42em}
.note+.note{margin-top:8px}

/* ---------- marcas de nível ---------- */
.pips{display:inline-flex;align-items:flex-end;gap:2px;flex:none}
.pips i{display:block;width:6px;height:6px;border:1.2px solid currentColor;border-radius:1px}
.pips i.on{background:currentColor}
.pips.rise i:nth-child(1){height:5px}
.pips.rise i:nth-child(2){height:8px}
.pips.rise i:nth-child(3){height:11px}

/* ---------- início ---------- */
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(2.9rem,12vw,4.8rem);line-height:1;letter-spacing:-.01em;margin:10px 0 14px}
.hero h1 span{color:var(--brass)}
.lede{max-width:34em;margin:0;color:color-mix(in srgb,var(--paper) 88%,var(--felt));text-wrap:pretty}
.spines{display:flex;align-items:flex-end;gap:5px;border-bottom:5px solid var(--shelf);margin:26px 0 0;padding-right:8px;overflow:hidden}
.spines span{
  position:relative;width:30px;padding:20px 0 8px;display:grid;place-items:center;flex:none;
  background:var(--bg);color:var(--fg);border-radius:3px 3px 0 0;
  font-family:var(--mono);font-weight:700;font-size:.78rem;letter-spacing:.08em;writing-mode:vertical-rl;
}
.spines span::before{content:"";position:absolute;left:0;right:0;top:7px;height:3px;background:color-mix(in srgb,var(--fg) 30%,transparent)}

/* ---------- ficha do leitor e estatísticas ---------- */
.readerbox{margin:28px 0 0}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.periods{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 8px}
.periods label{position:relative;cursor:pointer}
.periods input{position:absolute;opacity:0;inset:0;margin:0;width:100%;height:100%;cursor:pointer}
.periods span{display:inline-flex;align-items:center;min-height:40px;padding:6px 13px;border:1.5px solid var(--rule);border-radius:99px;font-family:var(--mono);font-size:.76rem;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);transition:border-color .12s,color .12s,background .12s}
.periods label:hover span{border-color:color-mix(in srgb,var(--paper) 40%,var(--felt))}
.periods input:checked+span{border-color:var(--brass);color:var(--brass);background:var(--raise)}
.periods input:focus-visible+span{outline:3px solid var(--brass);outline-offset:2px}
.pdesc{margin:0 0 12px;font-size:.92rem;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);margin:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
.kpis.k2{grid-template-columns:repeat(2,1fr)}
.kpis div{padding:12px 6px 12px 0;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.kpis div+div{padding-left:14px;border-left:1px solid var(--rule)}
.kpis dt{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.kpis dd{margin:2px 0 0;font-family:var(--body);font-weight:600;font-size:1.55rem;line-height:1.2;color:var(--paper)}
.kpis dd.big{color:var(--brass)}
.kpis .sub{display:block;font-family:var(--mono);font-weight:400;font-size:.72rem;letter-spacing:.02em;color:var(--mute);margin-top:3px}
.delta{display:block;font-family:var(--mono);font-weight:700;font-size:.76rem;margin-top:5px}
.delta.up{color:var(--ok-lt)}
.delta.down{color:var(--bad-lt)}
.delta.flat{color:var(--mute)}
.sth{font-family:var(--display);font-weight:400;font-size:clamp(2.1rem,9vw,3rem);line-height:1.05;margin:6px 0 10px}
#st-h:focus,#rtitle:focus{outline:none}
.sec{margin:30px 0 0}
.sec>.tag{margin-bottom:6px}
.srow{display:grid;grid-template-columns:64px minmax(0,1fr) 104px;grid-template-areas:"code name pct" "code bar cnt";column-gap:12px;row-gap:6px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--rule);border-radius:4px}
.srow:hover{background:var(--raise)}
.srow .code{grid-area:code;align-self:start;padding-top:2px;font-family:var(--mono);font-weight:700;font-size:.98rem;color:var(--mute)}
.srow .name{grid-area:name;min-width:0}
.srow .pct{grid-area:pct;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.srow .cnt{grid-area:cnt;text-align:right;white-space:nowrap;font-family:var(--mono);font-size:.74rem;color:var(--mute);font-variant-numeric:tabular-nums}
.meter{grid-area:bar;display:block;height:10px;border-radius:0 4px 4px 0;background:var(--track);overflow:hidden}
.meter>span{display:block;height:100%;background:var(--brass);border-radius:0 4px 4px 0}
.srow.empty .name,.srow.empty .pct{color:var(--mute)}
.recent{list-style:none;margin:0;padding:0}
.recent li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--rule)}
.recent time{font-family:var(--mono);font-size:.76rem;color:var(--mute);white-space:nowrap}
.recent .what{min-width:0}
.recent small{display:block;font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.recent .rres{text-align:right;white-space:nowrap;font-weight:600}
.recent .rres small{text-transform:none}
.empty-note{margin:10px 0 0;color:var(--mute)}

/* ---------- montagem da rodada ---------- */
fieldset{border:0;margin:28px 0 0;padding:0;min-width:0}
legend{padding:0;margin:0 0 10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg label{position:relative;display:block;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;margin:0;width:100%;height:100%;cursor:pointer}
.seg-b{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 6px;border:1.5px solid var(--rule);border-radius:5px;font-family:var(--mono);font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);transition:border-color .12s,color .12s,background .12s}
.seg label:hover .seg-b{border-color:color-mix(in srgb,var(--paper) 40%,var(--felt))}
.seg input:checked+.seg-b{border-color:var(--brass);color:var(--brass);background:var(--raise)}
.seg input:focus-visible+.seg-b{outline:3px solid var(--brass);outline-offset:2px}
.levels:disabled .seg{opacity:.4}
.levels:disabled .seg label{cursor:default}
.mode-desc{margin:8px 0 0;font-size:.98rem;color:var(--mute);min-height:1.5em}
.cats{display:grid;gap:8px}
.cat{display:block;position:relative;cursor:pointer}
.cat input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.cat-body{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--rule);border-radius:6px;transition:border-color .12s,background .12s}
.dw{font-family:var(--mono);font-weight:700;font-size:1.2rem;color:var(--mute);white-space:nowrap}
.nm strong{display:block;font-family:var(--display);font-weight:400;font-size:1.15rem;line-height:1.3}
.nm em{display:block;font-style:normal;color:var(--mute);font-size:.95rem;line-height:1.35}
.ct{font-family:var(--mono);font-size:.76rem;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.mast{display:flex;align-items:center;gap:8px;margin-top:6px;font-family:var(--mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.mbar{flex:none;width:96px;height:4px;border-radius:2px;background:var(--rule);overflow:hidden}
.mbar>span{display:block;height:100%;background:var(--brass)}
.cat:hover .cat-body{border-color:color-mix(in srgb,var(--paper) 40%,var(--felt))}
.cat input:checked+.cat-body{border-color:var(--brass);background:var(--raise)}
.cat input:checked+.cat-body .dw,.cat input:checked+.cat-body .ct{color:var(--brass)}
.cat input:focus-visible+.cat-body{outline:3px solid var(--brass);outline-offset:2px}
.cat.rev .dw{color:var(--bad-lt)}
.dock{position:sticky;bottom:0;z-index:2;margin:14px -16px 0;padding:12px 16px 14px;background:var(--felt);border-top:1px solid var(--rule);box-shadow:0 -14px 24px -14px rgba(0,0,0,.55);display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between}
.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;position:relative;min-height:44px}
.sw input{position:absolute;opacity:0;inset:0;margin:0;width:100%;height:100%;cursor:pointer}
.sw-box{width:40px;height:22px;border-radius:11px;background:var(--rule);position:relative;transition:background .15s;flex:none}
.sw-box::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--paper);transition:transform .15s}
.sw input:checked+.sw-box{background:var(--brass)}
.sw input:checked+.sw-box::after{transform:translateX(18px);background:var(--ink)}
.sw input:focus-visible+.sw-box{outline:3px solid var(--brass);outline-offset:3px}
.sw small{font-family:var(--mono);font-size:.74rem;color:var(--mute)}

/* ---------- botões ---------- */
.btn{
  font-family:var(--mono);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.9rem;
  min-height:48px;padding:12px 20px;border-radius:5px;border:1.5px solid var(--brass);
  background:var(--brass);color:var(--ink);cursor:pointer;transition:background .12s,border-color .12s;
}
.btn:hover{background:color-mix(in srgb,var(--brass) 82%,#fff)}
.btn:disabled{opacity:.45;cursor:default}
.btn .cnt{font-weight:400;opacity:.85}
.btn.ghost{background:transparent;color:var(--paper);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--paper)}
.btn:focus-visible,.link:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.link{
  background:none;border:0;color:var(--mute);font-family:var(--mono);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 2px;min-height:44px;
}
.link:disabled{opacity:.4;text-decoration:none;cursor:default}

/* ---------- jogo ---------- */
.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.hud-l{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--brass) 22%,var(--felt));color:var(--brass)}
.score{text-align:right;line-height:1}
.score b{display:block;font-family:var(--body);font-weight:600;font-size:1.9rem;color:var(--brass);margin-top:4px}
.shelf{display:flex;align-items:flex-end;gap:4px;height:56px;margin:0 0 14px;padding:0;list-style:none;border-bottom:5px solid var(--shelf)}
.shelf li{flex:1;position:relative;border-radius:2px 2px 0 0;background:color-mix(in srgb,var(--paper) 16%,var(--felt))}
.shelf li::after{content:"";position:absolute;left:0;right:0;top:7px;height:3px;background:rgba(0,0,0,.22)}
.shelf li.cur{background:var(--brass)}
.shelf li.ok{background:var(--ok-lt)}
.shelf li.no{background:transparent;box-shadow:inset 0 0 0 2px var(--bad-lt)}
.shelf li.no::after{background:var(--bad-lt);opacity:.7}
.trow{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.timer{flex:1;height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--brass);transform-origin:left center;will-change:transform}
.timer i.low{background:var(--bad-lt)}
#tnum{min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.card{position:relative;background:var(--paper);color:var(--ink);border-radius:6px;padding:16px 20px 20px;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 16px 32px -14px rgba(0,0,0,.6)}
.card :focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;padding-bottom:10px;font-family:var(--mono);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);border-bottom:1px solid color-mix(in srgb,var(--bad) 45%,var(--paper))}
.lvl{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.q{font-family:var(--display);font-weight:400;font-size:clamp(1.3rem,4.8vw,1.75rem);line-height:1.25;margin:18px 0 18px;text-wrap:balance}
#qtitle:focus{outline:none}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{
  display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:center;width:100%;min-height:54px;
  padding:9px 14px 9px 10px;text-align:left;font-size:1.06rem;line-height:1.35;color:var(--ink);background:transparent;
  border:1.5px solid color-mix(in srgb,var(--ink) 28%,var(--paper));border-radius:5px;cursor:pointer;
  transition:background .12s,border-color .12s,opacity .12s;
}
.opt .k{display:grid;place-items:center;width:30px;height:30px;border:1.5px solid currentColor;border-radius:3px;font-family:var(--mono);font-weight:700;font-size:.95rem}
.opt:hover:not(:disabled){background:color-mix(in srgb,var(--ink) 7%,var(--paper));border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper))}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--paper))}
.opt.no .k{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.opt.dim{opacity:.55}
.opt.gone{opacity:.3;text-decoration:line-through}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 12px;margin-top:14px;min-height:50px}
.card .link{color:var(--ink-mute)}
.hint{font-family:var(--mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mute)}
.pts-w{margin-left:auto;text-align:right;line-height:1.25}
.pts{display:block;font-family:var(--mono);font-weight:700;font-size:1.05rem}
.pts-sub{display:block;font-family:var(--mono);font-size:.72rem;color:var(--ink-mute)}
.stamp{
  display:inline-block;font-family:var(--mono);font-weight:700;font-size:1rem;letter-spacing:.14em;text-transform:uppercase;
  padding:4px 12px;border:3px double currentColor;border-radius:4px;transform:rotate(-6deg);transform-origin:left center;opacity:.92;
  animation:stamp .26s cubic-bezier(.2,.9,.3,1.2) both;
}
.stamp.ok{color:var(--ok)}
.stamp.no{color:var(--bad)}
@keyframes stamp{from{transform:rotate(-6deg) scale(1.7);opacity:0}}
.fact{margin-top:16px;padding:14px 16px 16px;border-left:3px solid var(--brass);background:var(--raise);border-radius:0 6px 6px 0}
.fact p+p{margin:6px 0 0;font-size:1.06rem}
.nextrow{display:flex;justify-content:flex-end;margin-top:16px}

/* ---------- resultado ---------- */
.result h2{font-family:var(--display);font-weight:400;font-size:clamp(2.1rem,9vw,3.2rem);line-height:1.05;margin:8px 0 8px;text-wrap:balance}
.result .msg{margin:0 0 18px;color:color-mix(in srgb,var(--paper) 88%,var(--felt));max-width:34em}
.lvrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 12px}
.lvchip{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--rule);border-radius:99px;font-family:var(--mono);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--paper)}
.lvchip b{color:var(--brass)}
.rshelf{margin-top:14px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.links{display:flex;flex-wrap:wrap;gap:0 22px;margin-top:6px}
.copyout{margin:10px 0 0}
.copyout input{width:100%;font-family:var(--mono);font-size:.85rem;padding:10px;border-radius:5px;border:1px solid var(--rule);background:var(--raise);color:var(--paper)}
.review{margin:28px 0 0}
.card.mini{margin-top:12px;padding:14px 18px 18px;content-visibility:auto;contain-intrinsic-size:auto 260px}
.q.sm{font-size:1.18rem;margin:12px 0 10px}
.card.mini p{margin:6px 0 0;font-size:1.02rem}
.card.mini .given{color:var(--bad)}
.card.mini .right{color:var(--ok);font-weight:600}
.clean{margin:10px 0 0;color:var(--mute)}

@media (max-width:560px){
  .kpis:not(.k3):not(.k2){grid-template-columns:repeat(2,1fr)}
  .kpis:not(.k3):not(.k2) div:nth-child(3){padding-left:0;border-left:0}
  .kpis:not(.k3):not(.k2) div:nth-child(n+3){border-top:1px solid var(--rule)}
}
@media (max-width:480px){
  .cat-body{grid-template-columns:60px 1fr}
  .dw{font-size:1.05rem}
  .ct{display:none}
  .card{padding:14px 16px 18px}
  .kpis dd{font-size:1.35rem}
}
@media (max-width:440px){.seg{grid-template-columns:repeat(2,1fr)}}
@media (hover:none){.hint{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<div id="live" class="sr" aria-live="polite"></div>
<script>
'use strict';

/* ================= classes, níveis, modos e períodos ================= */
const CATS=[
  {key:'fil',  dewey:'100',   name:'Filosofia',                       short:'Filosofia',      desc:'Pensadores e grandes ideias'},
  {key:'psi',  dewey:'150',   name:'Psicologia',                      short:'Psicologia',     desc:'Mente, comportamento e grandes experimentos'},
  {key:'cien', dewey:'500',   name:'Ciências',                        short:'Ciências',       desc:'Natureza, corpo e descobertas'},
  {key:'neuro',dewey:'612.8', name:'Neurociências e Neuropsicologia', short:'Neurociências',  desc:'Cérebro, neurônios, lesões e testes'},
  {key:'arte', dewey:'700',   name:'Artes e música',                  short:'Artes e música', desc:'Pintura, música, escultura e cinema'},
  {key:'lit',  dewey:'800',   name:'Literatura',                      short:'Literatura',     desc:'Romances, poemas e seus autores'},
  {key:'hist', dewey:'900',   name:'História',                        short:'História',       desc:'Da escrita ao século XX'},
  {key:'geo',  dewey:'910',   name:'Geografia',                       short:'Geografia',      desc:'Países, mares e montanhas'},
  {key:'br',   dewey:'981',   name:'Brasil',                          short:'Brasil',         desc:'História, cultura e território'}
];

["psi",2,"Qual é a ordem dos estágios do desenvolvimento cognitivo segundo Piaget?","Sensório-motor, pré-operatório, operatório concreto, operatório formal","Pré-operatório, sensório-motor, operatório formal, operatório concreto","Sensório-motor, operatório concreto, pré-operatório, operatório formal","Operatório concreto, sensório-motor, pré-operatório, operatório formal","Piaget via a criança como alguém que constrói ativamente o conhecimento. Os estágios correspondem, de modo aproximado, a 0 a 2 anos, 2 a 7, 7 a 11 e a partir dos 11 ou 12."],

["fil",3,"Para Tales de Mileto, tido como o primeiro filósofo do Ocidente, qual era o princípio de todas as coisas?","A água","O fogo","O ar","Os números","Tales também teria previsto um eclipse do Sol em 585 a.C. Depois dele, Anaxímenes apostou no ar, Heráclito no fogo e os pitagóricos nos números."],

["psi",1,"Nos testes de QI modernos, que valor corresponde à média da população?","100","50","150","200","Os testes são padronizados com média 100 e desvio-padrão de 15; cerca de dois terços das pessoas ficam entre 85 e 115. Ao longo do século XX, o desempenho bruto médio subiu, fenômeno chamado efeito Flynn."],

["psi",1,"Que psicólogo criou a abordagem centrada na pessoa?","Carl Rogers","Abraham Maslow","Albert Bandura","Viktor Frankl","Rogers defendia que o terapeuta oferecesse empatia, aceitação incondicional e autenticidade. Também foi pioneiro em gravar sessões de terapia para pesquisa."],

["psi",1,"Como se chama a melhora causada pela expectativa do paciente, mesmo sem substância ativa no tratamento?","Efeito placebo","Efeito halo","Efeito Pigmaleão","Efeito Hawthorne","O oposto também existe: no efeito nocebo, a expectativa de piora provoca sintomas reais. Por isso, testes de remédios comparam o grupo tratado com um grupo que recebe placebo."],
["psi",1,"Nos experimentos de Solomon Asch, o que muitos participantes fizeram diante de um grupo que dava respostas obviamente erradas?","Concordaram com o grupo, mesmo vendo o erro","Corrigiram o grupo em todas as rodadas","Desistiram de continuar o experimento","Pediram ajuda ao pesquisador","A tarefa era comparar o comprimento de linhas. Cerca de um terço das respostas acompanhou o erro do grupo, e três em cada quatro participantes cederam ao menos uma vez."],
["psi",2,"Que conceito de Vygotsky descreve a distância entre o que a criança faz sozinha e o que faz com ajuda?","Zona de desenvolvimento proximal","Estágio operatório concreto","Período crítico","Esquema cognitivo","Vygotsky morreu de tuberculose em 1934, aos 37 anos, e boa parte de sua obra só chegou ao Ocidente décadas depois."],
["psi",2,"O que o experimento do boneco João Bobo, de Albert Bandura, mostrou?","Que crianças imitam a agressividade que observam em adultos","Que a agressividade é totalmente inata","Que punições eliminam qualquer agressividade","Que meninos e meninas agem sempre igual","Crianças que viram um adulto bater no boneco tendiam a repetir os golpes. O estudo, de 1961, ajudou a fundar a teoria da aprendizagem social."],
["psi",3,"Pela lei de Yerkes-Dodson, que forma tem a relação entre nível de ativação e desempenho?","U invertido","Linha reta crescente","Linha reta decrescente","Curva exponencial","Um pouco de ativação melhora o desempenho, mas ativação demais o prejudica, sobretudo em tarefas complexas. O estudo original, de 1908, foi feito com camundongos."],
["psi",3,"Quem propôs a teoria da dissonância cognitiva, em 1957?","Leon Festinger","Kurt Lewin","Fritz Heider","Solomon Asch","Antes, ele e colegas acompanharam por dentro um grupo que previa o fim do mundo. Quando a profecia falhou, os membros mais comprometidos passaram a acreditar ainda mais, caso narrado no livro Quando a Profecia Falha, de 1956."],

["neuro",2,"Em 1848, uma barra de ferro atravessou o crânio do ferroviário Phineas Gage. Que mudança foi relatada depois?","Mudanças marcantes de personalidade e conduta","Perda total da memória dos anos anteriores","Incapacidade definitiva de falar","Cegueira nos dois olhos","A barra atingiu sobretudo o lobo frontal. Pesquisas sobre a vida dele sugerem que depois se readaptou em parte: trabalhou anos como cocheiro de diligências no Chile."],

const plural=function(n,one,many){return n===1?one:many;};
const shuffle=function(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};
const valid=function(id){return Number.isInteger(id)&&id>=0&&id<BANK.length;};
const LETTERS=['A','B','C','D'];
const JIT=[0,2,-1,1,-2,2,0,-1,1,-2];
const SPINE={1:28,2:38,3:48};
let DTF=null;try{DTF=new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){}
const fmtDate=function(t){return DTF?DTF.format(t):new Date(t).toLocaleString();};
const els={};

/* ================= armazenamento (só neste navegador) ================= */
const LS='repertorio.v1';
const store={ver:2,seen:[],got:[],book:[],log:[],arch:{rounds:0,n:0,hits:0,best:0,lv:{},cat:{}},sel:null};
(function load(){
  let m=null;
  try{const raw=localStorage.getItem(LS);if(raw)m=JSON.parse(raw);}catch(e){}
  if(!m||typeof m!=='object')return;
  if(m.ver!==2){
    /* versão anterior: os totais não tinham data, então entram só em "Todo o período" */
    store.arch.rounds=Number(m.rounds)||0;store.arch.n=Number(m.asked)||0;store.arch.hits=Number(m.hits)||0;store.arch.best=Number(m.best)||0;
    if(Array.isArray(m.seen))store.seen=m.seen;
    if(m.sel&&typeof m.sel==='object')store.sel=m.sel;
    return;
  }
  Object.assign(store,m);
  if(!Array.isArray(store.seen))store.seen=[];
  if(!Array.isArray(store.got))store.got=[];
  if(!Array.isArray(store.book))store.book=[];
  if(!Array.isArray(store.log))store.log=[];
  if(!store.arch||typeof store.arch!=='object')store.arch={rounds:0,n:0,hits:0,best:0,lv:{},cat:{}};
  store.arch.lv=store.arch.lv||{};store.arch.cat=store.arch.cat||{};
})();
store.log=store.log.filter(function(r){return r&&typeof r.t==='number'&&Array.isArray(r.q)&&typeof r.k==='string'&&r.q.length===r.k.length&&r.q.every(valid);});
const seen=new Set(store.seen.filter(valid)),got=new Set(store.got.filter(valid)),book=new Set(store.book.filter(valid));
let sel={cat:'all',mode:'prog',timed:false,period:'all'};
if(store.sel&&typeof store.sel==='object')Object.assign(sel,store.sel);
function fixSel(){
  if(!(sel.cat==='all'||CATMAP[sel.cat]||(sel.cat==='rev'&&book.size)))sel.cat='all';
  if(!MODES[sel.mode])sel.mode='prog';
  sel.timed=!!sel.timed;
  if(!PMAP[sel.period])sel.period='all';
}
fixSel();
function persist(){
  store.seen=Array.from(seen);store.got=Array.from(got);store.book=Array.from(book);store.sel=sel;
  try{localStorage.setItem(LS,JSON.stringify(store));}catch(e){}
}

/* ================= montagem das rodadas ================= */
function poolOrder(cat,lv){
  const ids=POOL[cat][lv];
  return shuffle(ids.filter(function(id){return !seen.has(id);})).concat(shuffle(ids.filter(function(id){return seen.has(id);})));
}
function planRound(cat,mode){
  if(cat==='rev')return shuffle(Array.from(book)).slice(0,ROUND).sort(function(a,b){return BANK[a].lv-BANK[b].lv;});
  const keys=cat==='all'?CATS.map(function(c){return c.key;}):[cat];
  const out=[];
  MODES[mode].plan.forEach(function(step){
    const lv=step[0],n=step[1];
    const lists=shuffle(keys).map(function(k){return poolOrder(k,lv);}).filter(function(l){return l.length;});
    const take=[];let k=0;
    while(take.length<n&&lists.length){
      const idx=k%lists.length,l=lists[idx];
      take.push(l.shift());
      if(!l.length)lists.splice(idx,1);else k++;
    }
    shuffle(take).forEach(function(id){out.push(id);});
  });
  return out;
}
function roundSize(cat,mode){
  if(cat==='rev')return Math.min(ROUND,book.size);
  const keys=cat==='all'?CATS.map(function(c){return c.key;}):[cat];
  return MODES[mode].plan.reduce(function(t,step){
    const avail=keys.reduce(function(a,k){return a+POOL[k][step[0]].length;},0);
    return t+Math.min(step[1],avail);
  },0);
}
function markSeen(id){
  seen.add(id);
  const pool=POOL[BANK[id].cat][BANK[id].lv];
  if(pool.every(function(i){return seen.has(i);}))pool.forEach(function(i){seen.delete(i);});
}
function mastery(k){
  if(!k)return {n:got.size,total:BANK.length};
  let n=0;CAT_IDS[k].forEach(function(id){if(got.has(id))n++;});
  return {n:n,total:CAT_IDS[k].length};
}

/* ================= registro das respostas e estatísticas ================= */
function findLog(t){for(let i=store.log.length-1;i>=0;i--){if(store.log[i].t===t)return store.log[i];}return null;}
function logAnswer(id,ok){
  let r=s.logT?findLog(s.logT):null;
  if(!r){r={t:Date.now(),c:s.cat,m:s.cat==='rev'?'rev':s.mode,s:0,q:[],k:'',d:0};store.log.push(r);s.logT=r.t;}
  r.q.push(id);r.k+=ok?'1':'0';r.s=s.score;
}
function foldLog(){
  /* acima de 5 mil rodadas, as mais antigas viram totais sem data, para não lotar o armazenamento */
  if(store.log.length<=5000)return;
  const old=store.log.splice(0,1000),a=store.arch;
  old.forEach(function(r){
    if(r.d){a.rounds++;if(r.s>a.best)a.best=r.s;}
    r.q.forEach(function(id,j){
      const q=BANK[id],ok=r.k.charAt(j)==='1';
      a.n++;if(ok)a.hits++;
      const L=a.lv[q.lv]||(a.lv[q.lv]=[0,0]);L[1]++;if(ok)L[0]++;
      const C=a.cat[q.cat]||(a.cat[q.cat]=[0,0]);C[1]++;if(ok)C[0]++;
    });
  });
}
function aggregate(from,to,withArch){
  const st={rounds:0,n:0,hits:0,best:0,lv:{1:[0,0],2:[0,0],3:[0,0]},cat:{},recent:[]};
  CATS.forEach(function(c){st.cat[c.key]=[0,0];});
  store.log.forEach(function(r){
    if(r.t<from||r.t>=to)return;
    if(r.d){st.rounds++;if(r.s>st.best)st.best=r.s;st.recent.push(r);}
    for(let j=0;j<r.q.length;j++){
      const q=BANK[r.q[j]],ok=r.k.charAt(j)==='1';
      st.n++;st.lv[q.lv][1]++;st.cat[q.cat][1]++;
      if(ok){st.hits++;st.lv[q.lv][0]++;st.cat[q.cat][0]++;}
    }
  });
  if(withArch){
    const a=store.arch;
    st.rounds+=a.rounds;st.n+=a.n;st.hits+=a.hits;if(a.best>st.best)st.best=a.best;
    Object.keys(a.lv).forEach(function(k){if(st.lv[k]){st.lv[k][0]+=a.lv[k][0];st.lv[k][1]+=a.lv[k][1];}});
    Object.keys(a.cat).forEach(function(k){if(st.cat[k]){st.cat[k][0]+=a.cat[k][0];st.cat[k][1]+=a.cat[k][1];}});
  }
  st.recent.sort(function(x,y){return y.t-x.t;});
  return st;
}
function statsFor(key){
  const P=PMAP[key]||PMAP.all;
  return aggregate(P.ms?Date.now()-P.ms:-Infinity,Infinity,!P.ms);
}
function deltaFor(key){
  const P=PMAP[key];if(!P||!P.ms)return null;
  const now=Date.now(),cur=aggregate(now-P.ms,Infinity,false),prev=aggregate(now-2*P.ms,now-P.ms,false);
  if(!cur.n||!prev.n)return null;
  return pct(cur.hits,cur.n)-pct(prev.hits,prev.n);
}
function bestExcept(t){
  let b=store.arch.best||0;
  store.log.forEach(function(r){if(r.d&&r.t!==t&&r.s>b)b=r.s;});
  return b;
}

/* ================= estado do jogo ================= */
let s=null,view='home';
function startRound(cat,mode,timed,ids){
  stopTimer();
  const qids=ids&&ids.length?ids.filter(valid):planRound(cat,mode);
  if(!qids.length){goHome();return;}
  s={v:2,screen:'game',cat:cat,mode:mode,timed:!!timed,qids:qids,orders:qids.map(function(){return shuffle([0,1,2,3]);}),answers:[],removed:[],
     i:0,score:0,streak:0,bestStreak:0,fiftyUsed:false,fiftyAt:-1,left:0,limit:0,newGot:0,logT:0};
  prep();render();window.scrollTo(0,0);focusTitle();startTimer();
}
function prep(){s.limit=LV[BANK[s.qids[s.i]].lv].time;s.left=s.limit;}

/* ---- cronômetro: anda por quadros e fica parado quando a aba está escondida ---- */
let raf=0,lastTs=0,shownSec=-1;
const reduceMotion=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
function timerOn(){return !!(s&&s.screen==='game'&&s.timed&&!s.answers[s.i]);}
function stopTimer(){if(raf){cancelAnimationFrame(raf);raf=0;}}
function startTimer(){
  stopTimer();
  if(!timerOn())return;
  lastTs=performance.now();shownSec=-1;paintTimer(true);
  raf=requestAnimationFrame(frame);
}
function frame(ts){
  raf=0;
  if(!timerOn())return;
  const dt=Math.min(.25,Math.max(0,(ts-lastTs)/1000));lastTs=ts;
  s.left=Math.max(0,s.left-dt);
  paintTimer(false);
  if(s.left<=0){answer(null);return;}
  raf=requestAnimationFrame(frame);
}
function paintTimer(force){
  const sec=Math.ceil(s.left),changed=sec!==shownSec;
  if(changed){shownSec=sec;if(els.tnum)els.tnum.textContent=sec+' s';}
  if(els.tbar&&(force||changed||!reduceMotion)){
    const f=Math.max(0,Math.min(1,(reduceMotion?sec:s.left)/s.limit));
    els.tbar.style.transform='scaleX('+f+')';
    els.tbar.classList.toggle('low',s.left<6);
  }
}

/* ---- respostas ---- */
function answer(pos){
  if(!s||s.screen!=='game'||s.answers[s.i])return;
  stopTimer();
  const q=BANK[s.qids[s.i]],ok=pos!==null&&s.orders[s.i][pos]===0;
  let pts=0,parts=null;
  if(ok){
    const base=LV[q.lv].pts,b=s.fiftyAt===s.i?Math.round(base*.6):base;
    const sb=25*Math.min(s.streak,4),tb=s.timed?Math.round(30*Math.max(0,s.left)/s.limit):0;
    pts=b+sb+tb;parts=[b,sb,tb];
    s.streak++;if(s.streak>s.bestStreak)s.bestStreak=s.streak;
    if(!got.has(q.id)){got.add(q.id);s.newGot++;}
    book.delete(q.id);
  }else{s.streak=0;book.add(q.id);}
  s.score+=pts;
  s.answers[s.i]={pick:pos,ok:ok,pts:pts,parts:parts,timeout:pos===null};
  markSeen(q.id);logAnswer(q.id,ok);persist();
  live.textContent=(ok?'Correto, mais '+pts+' pontos. ':(pos===null?'Tempo esgotado. ':'Incorreto. '))+'Resposta certa: '+q.a+'. '+q.x;
  render();
  if(els.next)els.next.focus();
}
function fifty(){
  if(!s||s.fiftyUsed||s.answers[s.i])return;
  const order=s.orders[s.i];
  s.removed[s.i]=shuffle([0,1,2,3].filter(function(p){return order[p]!==0;})).slice(0,2);
  s.fiftyUsed=true;s.fiftyAt=s.i;
  render();
  const first=app.querySelector('.opt:not(:disabled)');if(first)first.focus();
}
function next(){
  if(!s||!s.answers[s.i])return;
  if(s.i>=s.qids.length-1){finish();return;}
  s.i++;prep();render();window.scrollTo(0,0);focusTitle();startTimer();
}
function finish(){
  stopTimer();
  s.hits=s.answers.filter(function(a){return a&&a.ok;}).length;
  s.prevBest=bestExcept(s.logT);
  const r=s.logT?findLog(s.logT):null;
  if(r){r.d=1;r.s=s.score;}
  s.newBest=s.score>0&&s.score>s.prevBest;
  foldLog();persist();
  s.screen='result';render();window.scrollTo(0,0);
  const h=document.getElementById('rtitle');if(h)h.focus({preventScroll:true});
}
function wrongIds(){return s.qids.filter(function(id,k){return s.answers[k]&&!s.answers[k].ok;});}
function goHome(){stopTimer();s=null;view='home';fixSel();render();window.scrollTo(0,0);}
function openStats(){stopTimer();s=null;view='stats';render();window.scrollTo(0,0);const h=document.getElementById('st-h');if(h)h.focus({preventScroll:true});}
function focusTitle(){const t=document.getElementById('qtitle');if(t)t.focus({preventScroll:true});}

/* ================= pedaços de tela ================= */
function lvPips(lv){return '<span class="pips" aria-hidden="true">'+[1,2,3].map(function(i){return '<i'+(i<=lv?' class="on"':'')+'></i>';}).join('')+'</span>';}
function modePips(k){return MODES[k].rise?'<span class="pips rise" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i></span>':lvPips(MODES[k].lv);}
function countText(n){return '· '+n+' '+plural(n,'ficha','fichas');}
function modeDesc(n){
  if(sel.cat==='rev')return 'No caderno, as fichas vêm da mais fácil para a mais difícil, até 10 por rodada.';
  return MODES[sel.mode].desc+(n<ROUND?' Nesta classe, a rodada tem '+n+' fichas.':'');
}
function periodDesc(){
  return PMAP[sel.period].desc+(sel.period!=='all'&&store.arch.n?' Rodadas anteriores a esta versão aparecem só em Todo o período.':'');
}
function periodPills(){
  return '<div class="periods" role="radiogroup" aria-label="Período das estatísticas">'+PERIODS.map(function(p){
    return '<label><input type="radio" name="period" value="'+p.key+'"'+(sel.period===p.key?' checked':'')+'><span>'+p.name+'</span></label>';
  }).join('')+'</div>';
}
function kpiHTML(st,withDelta){
  let delta='';
  if(withDelta){
    const d=deltaFor(sel.period);
    if(d!==null){
      const cls=d>0?'up':d<0?'down':'flat',txt=d>0?'▲ +'+d+' p.p.':d<0?'▼ '+d+' p.p.':'= sem variação';
      delta='<span class="delta '+cls+'">'+txt+'</span><span class="sub">'+PMAP[sel.period].vs+'</span>';
    }
  }
  return '<dl class="kpis">'+
    '<div><dt>Rodadas</dt><dd>'+fmt(st.rounds)+'</dd></div>'+
    '<div><dt>Respostas</dt><dd>'+fmt(st.n)+'</dd></div>'+
    '<div><dt>Acertos</dt><dd class="big">'+(st.n?pct(st.hits,st.n)+'%':'—')+(st.n?'<span class="sub">'+fmt(st.hits)+' de '+fmt(st.n)+'</span>':'')+delta+'</dd></div>'+
    '<div><dt>Melhor rodada</dt><dd>'+(st.best?fmt(st.best)+' <span class="unit">pts</span>':'—')+'</dd></div>'+
  '</dl>';
}
function catRow(c,count,m){
  const bar=m&&m.n?'<span class="mast"><span class="mbar"><span style="width:'+(m.n/m.total*100).toFixed(1)+'%"></span></span>'+m.n+' de '+m.total+' dominadas</span>':'';
  return '<label class="cat'+(c.key==='rev'?' rev':'')+'"><input type="radio" name="cat" value="'+c.key+'"'+(sel.cat===c.key?' checked':'')+'>'+
    '<span class="cat-body"><span class="dw">'+c.dewey+'</span><span class="nm"><strong>'+c.name+'</strong><em>'+c.desc+'</em>'+bar+'</span><span class="ct">'+count+'</span></span></label>';
}
function shelfHTML(cur){
  let h='';
  for(let k=0;k<s.qids.length;k++){
    const a=s.answers[k],lv=BANK[s.qids[k]].lv;
    const cls=a?(a.ok?'ok':'no'):(cur&&k===s.i?'cur':'');
    h+='<li class="'+cls+'" style="height:'+(SPINE[lv]+JIT[k%JIT.length])+'px"></li>';
  }
  return '<ol class="shelf" aria-hidden="true">'+h+'</ol>';
}
function srow(code,name,hn){
  const h=hn[0],n=hn[1],p=pct(h,n);
  return '<div class="srow'+(n?'':' empty')+'"><span class="code">'+code+'</span><span class="name">'+name+'</span><span class="pct">'+(n?p+'%':'—')+'</span>'+
    '<span class="meter" aria-hidden="true"><span style="width:'+(n?p:0)+'%"></span></span><span class="cnt">'+(n?fmt(h)+' de '+fmt(n):'sem respostas')+'</span></div>';
}
function recentRow(r){
  const c=catOf(r.c),mode=r.m==='rev'?'Revisão':(MODES[r.m]?MODES[r.m].name:''),n=r.q.length;
  let h=0;for(let j=0;j<n;j++)if(r.k.charAt(j)==='1')h++;
  const what=r.m==='rev'?'Caderno de revisão':c.dewey+' · '+c.short+'<small>'+mode+'</small>';
  return '<li><time datetime="'+new Date(r.t).toISOString()+'">'+fmtDate(r.t)+'</time><span class="what">'+what+'</span><span class="rres">'+h+'/'+n+'<small>'+fmt(r.s)+' pts</small></span></li>';
}
function rank(p){
  if(p>=1)return ['Curador do acervo','Gabarito completo. Nenhuma ficha escapou.'];
  if(p>=.8)return ['Bibliotecário-chefe','Repertório sólido. Faltou muito pouco.'];
  if(p>=.6)return ['Pesquisador','Boa base. As fichas erradas abaixo rendem as melhores curiosidades.'];
  if(p>=.4)return ['Leitor assíduo','Metade do caminho andada. Vale rever as respostas.'];
  if(p>=.2)return ['Folheador','Você passou o olho pelo acervo. Agora é hora de ler com calma.'];
  return ['Visitante','Primeira visita a estas estantes. A próxima rodada vai render mais.'];
}
function shareText(){
  const c=catOf(s.cat),m=s.cat==='rev'?'Revisão':MODES[s.mode].name;
  return 'Repertório · '+c.dewey+' '+c.name+' · '+m+': '+s.hits+' de '+s.qids.length+' acertos e '+fmt(s.score)+' pontos.';
}

  const SP=[
    ['var(--brass)','var(--ink)'],['var(--paper)','var(--ink)'],['var(--bad)','var(--paper)'],['var(--ok-lt)','var(--ink)'],
    ['color-mix(in srgb,var(--brass) 45%,var(--paper))','var(--ink)'],['color-mix(in srgb,var(--paper) 70%,var(--felt))','var(--ink)'],
    ['var(--bad-lt)','var(--ink)'],['color-mix(in srgb,var(--ok) 55%,var(--paper))','var(--ink)'],['color-mix(in srgb,var(--brass) 62%,var(--felt))','var(--paper)']
  ];

    periodPills()+'<p class="pdesc" id="pdesc">'+periodDesc()+'</p>'+

  '</section>'+

      '<div class="seg">'+segs+'</div><p class="mode-desc" id="modeDesc">'+modeDesc(n)+'</p></fieldset>'+

}
function viewGame(){
  const q=BANK[s.qids[s.i]],c=catOf(q.cat),L=LV[q.lv],order=s.orders[s.i],texts=[q.a,q.w[0],q.w[1],q.w[2]];
  const ans=s.answers[s.i],gone=s.removed[s.i]||[],last=s.i>=s.qids.length-1;
  let opts='';
  for(let pos=0;pos<4;pos++){
    const oi=order[pos];let cls='',key=LETTERS[pos],tail='';
    if(ans){
      if(oi===0){cls='ok';key='✓';tail='<span class="sr"> (resposta certa)</span>';}
      else if(ans.pick===pos){cls='no';key='✕';tail='<span class="sr"> (sua resposta)</span>';}
      else cls='dim';
    }else if(gone.indexOf(pos)>=0)cls='gone';
    const dis=ans||gone.indexOf(pos)>=0;
    opts+='<li><button type="button" class="opt '+cls+'" data-pos="'+pos+'"'+(dis?' disabled':'')+'><span class="k" aria-hidden="true">'+key+'</span><span>'+texts[oi]+tail+'</span></button></li>';
  }
  let foot;
  if(ans){
    let sub='';
    if(ans.ok&&ans.parts){const p=ans.parts;sub=p[0]+' do nível'+(s.fiftyAt===s.i?' (50/50)':'')+(p[1]?' + '+p[1]+' de sequência':'')+(p[2]?' + '+p[2]+' de tempo':'');}
    foot='<div class="foot"><span class="stamp '+(ans.ok?'ok':'no')+'">'+(ans.timeout?'Tempo esgotado':ans.ok?'Confirmado':'Revisar')+'</span>'+
      '<span class="pts-w"><span class="pts">'+(ans.ok?'+'+fmt(ans.pts):'0')+' pts</span>'+(sub?'<span class="pts-sub">'+sub+'</span>':'')+'</span></div>';
  }else{
    foot='<div class="foot"><button type="button" class="link" data-act="fifty"'+(s.fiftyUsed?' disabled':'')+'>Consultar o acervo (50/50)</button><span class="hint">teclas 1 a 4</span></div>';
  }
  const after=ans
    ?'<div class="fact"><p class="tag brass">Ficha de curiosidade</p><p>'+q.x+'</p></div>'+
     '<div class="nextrow"><button type="button" class="btn" id="next" data-act="next">'+(last?'Ver resultado':'Próxima ficha')+' →</button></div>'
    :'';
  const timerRow=s.timed
    ?'<div class="trow"><div class="timer"><i id="tbar" style="transform:scaleX('+Math.max(0,Math.min(1,s.left/s.limit))+')"></i></div><span id="tnum" class="tag">'+Math.ceil(Math.max(0,s.left))+' s</span></div>'
    :'';
  return ''+
  '<div class="hud">'+
    '<div class="hud-l"><button type="button" class="link" data-act="exit">Sair</button>'+(s.streak>=2?'<span class="chip">Sequência '+s.streak+'</span>':'')+'</div>'+
    '<div class="score"><span class="tag">Pontos</span><b>'+fmt(s.score)+'</b></div>'+
  '</div>'+
  shelfHTML(true)+timerRow+
  '<section class="card" aria-labelledby="qtitle">'+
    '<div class="card-head"><span>'+c.dewey+' · '+c.short+'</span><span class="lvl">'+lvPips(q.lv)+L.name+' · '+(s.i+1)+'/'+s.qids.length+'</span></div>'+
    '<h2 class="q" id="qtitle" tabindex="-1">'+q.q+'</h2>'+
    '<ul class="opts">'+opts+'</ul>'+foot+
  '</section>'+after;
}
function viewResult(){
  const n=s.qids.length,rk=rank(n?s.hits/n:0),c=catOf(s.cat),modeName=s.cat==='rev'?'Revisão':MODES[s.mode].name;
  const per={1:[0,0],2:[0,0],3:[0,0]};
  s.qids.forEach(function(id,k){const lv=BANK[id].lv;per[lv][1]++;if(s.answers[k]&&s.answers[k].ok)per[lv][0]++;});
  const chips=[1,2,3].filter(function(lv){return per[lv][1];}).map(function(lv){return '<span class="lvchip">'+lvPips(lv)+LV[lv].name+' <b>'+per[lv][0]+'/'+per[lv][1]+'</b></span>';}).join('');
  const wrong=[];
  s.qids.forEach(function(id,k){const a=s.answers[k];if(a&&!a.ok)wrong.push({q:BANK[id],a:a,order:s.orders[k]});});
  const review=wrong.length?wrong.map(function(r){
    const texts=[r.q.a,r.q.w[0],r.q.w[1],r.q.w[2]],cc=catOf(r.q.cat);
    const given=r.a.timeout?'Tempo esgotado.':'Você marcou: '+texts[r.order[r.a.pick]]+'.';
    return '<article class="card mini"><div class="card-head"><span>'+cc.dewey+' · '+cc.short+'</span><span class="lvl">'+lvPips(r.q.lv)+LV[r.q.lv].name+'</span></div>'+
      '<h4 class="q sm">'+r.q.q+'</h4><p class="given">✕ '+given+'</p><p class="right">✓ Resposta certa: '+r.q.a+'.</p><p>'+r.q.x+'</p></article>';
  }).join(''):'<p class="clean">Nenhuma ficha para revisar nesta rodada.</p>';
  const canAgain=s.cat!=='rev'||book.size>0;
  const recLine=(s.newBest?'Novo recorde pessoal':'Recorde pessoal: '+fmt(Math.max(s.prevBest||0,s.score))+' pts')+
    (s.newGot?' · +'+s.newGot+' '+plural(s.newGot,'ficha dominada','fichas dominadas'):'');
  return ''+
  '<section class="result">'+
    '<p class="tag">Rodada concluída · '+c.dewey+' '+c.short+' · '+modeName+'</p>'+
    '<h2 id="rtitle" tabindex="-1">'+rk[0]+'</h2>'+
    '<p class="msg">'+rk[1]+'</p>'+
    '<dl class="kpis k3">'+
      '<div><dt>Pontos</dt><dd class="big">'+fmt(s.score)+'</dd></div>'+
      '<div><dt>Acertos</dt><dd>'+s.hits+'/'+n+'</dd></div>'+
      '<div><dt>Maior sequência</dt><dd>'+s.bestStreak+'</dd></div>'+
    '</dl>'+
    '<div class="lvrow">'+chips+'</div>'+
    '<p class="tag'+(s.newBest?' brass':'')+'">'+recLine+'</p>'+
    '<div class="rshelf">'+shelfHTML(false)+'</div>'+
    '<div class="actions">'+
      (canAgain?'<button type="button" class="btn" data-act="again">'+(s.cat==='rev'?'Revisar mais':'Jogar de novo')+'</button>':'')+
      (wrong.length?'<button type="button" class="btn ghost" data-act="review">'+(wrong.length===1?'Revisar a ficha errada':'Revisar as '+wrong.length+' erradas')+'</button>':'')+
    '</div>'+
    '<div class="links">'+
      '<button type="button" class="link" data-act="menu">Trocar de classe</button>'+
      '<button type="button" class="link" data-act="stats">Estatísticas</button>'+
      '<button type="button" class="link" data-act="copy">Copiar resultado</button>'+
    '</div>'+
    '<p class="copyout" id="copyout" hidden><label class="sr" for="copytext">Resultado para copiar</label><input id="copytext" type="text" readonly></p>'+
    (s.cat==='rev'&&!book.size?'<p class="clean">Caderno de revisão vazio: todas as fichas erradas já foram acertadas.</p>':'')+
    '<div class="review"><h3 class="tag">Para revisar ('+wrong.length+')</h3>'+review+'</div>'+
  '</section>';
}
function viewStats(){
  const st=statsFor(sel.period),m=mastery(null);
  const lvRows=[1,2,3].map(function(lv){return srow(lvPips(lv),LV[lv].name,st.lv[lv]);}).join('');
  const catRows=CATS.map(function(c){return srow(c.dewey,c.name,st.cat[c.key]);}).join('');
  const recent=st.recent.slice(0,8).map(recentRow).join('');
  const brk=st.lv[1][1]+st.lv[2][1]+st.lv[3][1];
  return ''+
  '<div class="hud"><button type="button" class="link" data-act="menu">← Voltar</button></div>'+
  '<section aria-labelledby="st-h">'+
    '<p class="tag">Ficha do leitor</p><h2 class="sth" id="st-h" tabindex="-1">Estatísticas</h2>'+
    periodPills()+'<p class="pdesc">'+periodDesc()+'</p>'+
    kpiHTML(st,true)+
    (st.n?'':'<p class="empty-note">Nenhuma resposta registrada neste período.</p>')+
    '<div class="sec"><h3 class="tag">Acerto por nível</h3>'+lvRows+'</div>'+
    '<div class="sec"><h3 class="tag">Acerto por classe</h3>'+catRows+'</div>'+
    (st.n>brk?'<p class="note">'+fmt(st.n-brk)+' '+plural(st.n-brk,'resposta','respostas')+' de antes desta versão '+plural(st.n-brk,'entra','entram')+' no total, mas não tem divisão por nível ou classe.</p>':'')+
    '<div class="sec"><h3 class="tag">Últimas rodadas concluídas</h3>'+(recent?'<ol class="recent">'+recent+'</ol>':'<p class="empty-note">Nenhuma rodada concluída neste período.</p>')+'</div>'+
    '<div class="sec"><h3 class="tag">Acervo</h3><dl class="kpis k2">'+
      '<div><dt>Fichas dominadas</dt><dd>'+fmt(m.n)+' <span class="unit">de '+m.total+'</span></dd></div>'+
      '<div><dt>No caderno de revisão</dt><dd>'+fmt(book.size)+'</dd></div>'+
    '</dl><p class="note">Dominadas são as fichas que você já acertou ao menos uma vez, em qualquer período. O caderno guarda as erradas até você acertá-las.</p></div>'+
    '<p class="note">Os períodos contam para trás a partir de agora: 1 mês são os últimos 30 dias, e 1 ano, os últimos 365. Respostas de rodadas interrompidas entram no acerto; só rodadas concluídas contam como rodada. Tudo fica salvo apenas neste navegador.</p>'+
    '<div class="actions"><button type="button" class="btn" data-act="menu">Voltar ao início</button></div>'+
  '</section>';
}
function render(){
  app.innerHTML=s?(s.screen==='game'?viewGame():viewResult()):(view==='stats'?viewStats():viewHome());
  els.tbar=document.getElementById('tbar');els.tnum=document.getElementById('tnum');els.next=document.getElementById('next');
}
function updateSetup(){
  const n=roundSize(sel.cat,sel.mode);
  const cnt=document.getElementById('startCount'),desc=document.getElementById('modeDesc'),lv=document.getElementById('levels'),st=app.querySelector('[data-act="start"]');
  if(cnt)cnt.textContent=countText(n);
  if(lv)lv.disabled=sel.cat==='rev';
  if(desc)desc.textContent=modeDesc(n);
  if(st)st.disabled=!n;
}
function copyResult(b){
  const text=shareText();
  const fallback=function(){
    const o=document.getElementById('copyout');
    if(o){o.hidden=false;const i=o.querySelector('input');i.value=text;i.focus();i.select();}
    b.textContent='Copie o texto abaixo';
  };
  try{
    navigator.clipboard.writeText(text).then(function(){b.textContent='Copiado';},fallback);
  }catch(e){fallback();}
}

/* ================= eventos ================= */
app.addEventListener('click',function(e){
  const opt=e.target.closest('[data-pos]');
  if(opt){answer(Number(opt.dataset.pos));return;}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const act=b.dataset.act;
  if(act==='start')startRound(sel.cat,sel.mode,sel.timed);
  else if(act==='fifty')fifty();
  else if(act==='next')next();
  else if(act==='again')startRound(s.cat,s.mode,s.timed);
  else if(act==='review')startRound('rev',s.mode,s.timed,wrongIds());
  else if(act==='menu')goHome();
  else if(act==='stats')openStats();
  else if(act==='copy')copyResult(b);
  else if(act==='exit'){
    if(b.dataset.confirm){goHome();}
    else{
      b.dataset.confirm='1';b.textContent='Confirmar saída';
      setTimeout(function(){if(b.isConnected){delete b.dataset.confirm;b.textContent='Sair';}},3500);
    }
  }
});
app.addEventListener('change',function(e){
  const t=e.target;
  if(t.name==='period'){
    sel.period=t.value;persist();
    if(!s&&view==='stats'){
      render();
      const r=app.querySelector('input[name="period"][value="'+sel.period+'"]');if(r)r.focus();
    }else{
      const k=document.getElementById('kpiHome'),d=document.getElementById('pdesc');
      if(k)k.innerHTML=kpiHTML(statsFor(sel.period),false);
      if(d)d.textContent=periodDesc();
    }
    return;
  }
  if(t.name==='cat')sel.cat=t.value;
  else if(t.name==='mode')sel.mode=t.value;
  else if(t.id==='timed')sel.timed=t.checked;
  else return;
  persist();updateSetup();
});
document.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey||!s||s.screen!=='game')return;
  const ans=s.answers[s.i],k=(e.key||'').toLowerCase();
  if(!ans){
    let pos=-1;
    if(k.length===1&&'1234'.indexOf(k)>=0)pos=Number(k)-1;
    else if(k.length===1&&'abcd'.indexOf(k)>=0)pos=k.charCodeAt(0)-97;
    if(pos>=0){
      if((s.removed[s.i]||[]).indexOf(pos)>=0)return;
      e.preventDefault();answer(pos);
    }
  }else if(e.key==='Enter'&&!e.target.closest('button')){
    e.preventDefault();next();
  }
});

/* ================= início e retomada depois de uma nova versão ================= */
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){
  window.claude.hot.snapshot(function(){return JSON.parse(JSON.stringify({v:2,s:s,sel:sel,view:view}));});
}
function boot(d){
  d=d||{};
  if(d.sel&&typeof d.sel==='object'){Object.assign(sel,d.sel);fixSel();}
  view=d.v===2&&d.view==='stats'?'stats':'home';
  const r=d.v===2?d.s:null;
  if(r&&(r.screen==='game'||r.screen==='result')&&Array.isArray(r.qids)&&r.qids.length&&r.qids.every(valid)&&
     Array.isArray(r.orders)&&r.orders.length===r.qids.length&&r.i>=0&&r.i<r.qids.length){
    s=r;
    if(!Array.isArray(s.answers))s.answers=[];
    if(!Array.isArray(s.removed))s.removed=[];
    if(!s.limit)prep();
    render();
    if(s.screen==='game')startTimer();
  }else{s=null;render();}
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);
else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
</script>
